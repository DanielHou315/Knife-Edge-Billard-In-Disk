# Initially-straight coin: the singular omega = 0 dynamics (Section 3.2).
billiard:
  R: 0.2

coin:
  x: 0.0
  y: 0.16
  theta: 0.0                   # heading along +x, i.e. along the diameter it travels
  v: 0.1                       # l * 10
  omega: 0.0                   # <- straight-line (Section 3.2) dynamics
  l: 0.01                      # half-length: the coin spans [-l, +l]
  m: 0.0025
  # J omitted -> derived as the uniform bar J = m*l^2/3 = 8.333...e-09
  # (equivalently m*ell^2/12 for the full length ell = 2l).
