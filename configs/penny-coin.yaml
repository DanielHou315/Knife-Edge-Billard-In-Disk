# Reference config for testing — mirrors the "Replicate their config" block
# that was hardcoded in main.py before it became config-driven.
billiard:
  R: 0.2

coin:
  x: 0.0
  y: 0.0
  theta: "pi/2"                 # may be a number or a pi-expression string
  v: 0.1                       # l * 10
  omega: 0.2
  l: 0.01                      # half-length: the coin spans [-l, +l]
  m: 0.0025
  # J omitted -> derived as the uniform bar J = m*l^2/3 = 8.333...e-09
  # (equivalently m*ell^2/12 for the full length ell = 2l).
